services:

  transaction-service:
    image: acme-pay-transaction-service
    container_name: transaction-service
    networks:
      - transaction-service
      - acme-pay
    environment:
      DB_DATABASE: transaction-service
      DB_HOST: transaction-service-db
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DB_USER: postgres
      SERVER_PORT: 8080
    depends_on:
      - transaction-db

  transaction-db:
    image: postgres:16
    container_name: transaction-service-db
    networks:
      - transaction-service
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - "../data/transactions/postgresql:/var/lib/postgresql/data"
    ports:
      - "${DB_PORT}:5432"

networks:
  transaction-service:
  acme-pay:
    external: true

