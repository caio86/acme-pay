on:
  push:
    tags:
      - '*'
    branches: [ main, develop ]
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - name: acme-pay-account-service
            port: 8080
          - name: acme-pay-customer-service
            port: 8080
          - name: acme-pay-notification-service
            port: 8080
          - name: acme-pay-transaction-service
            port: 8080
          - name: acme-pay-gateway-service
            port: 8090
          - name: acme-pay-eureka-server
            port: 8761

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        run: |
          if [[ "${{ github.ref }}" == refs/heads/main && "${{ github.ref_type }}" == "tag" ]]; then
            echo "TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image for ${{ matrix.service }}
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: caio86/${{ matrix.service.name }}:${{ env.TAG }}
          build-args: |
            SERVICE_NAME=${{ matrix.service.name }}
            SERVICE_PORT=${{ matrix.service.port }}
