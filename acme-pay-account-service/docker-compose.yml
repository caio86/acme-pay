services:

  account-service:
    container_name: account-service
    image: acme-pay-account-service:v1.0
    build:
      context: .
      dockerfile: ./Dockerfile
    networks:
      - account-service
      - acme-pay
    environment:
      DB_HOST: account-service-db
    ports:
      - "8081:8080"
    depends_on:
      - account-db

  account-db:
    image: postgres:16
    container_name: account-service-db
    networks:
      - account-service
    restart: always
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - "./data/accounts/postgres:/var/lib/postgres/data"
    ports:
      - "${DB_PORT}:5432"

networks:
  account-service:
  acme-pay:
    external: true
